<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0a0a0b" />
<title>404 Not Found | Jigar Darji</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0b'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%234d9dff'/%3E%3C/svg%3E" />
<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/inter.woff2" crossorigin />
<style>
  /* Self-hosted, matching index.html. Absolute path so this page still
     styles correctly when served for an arbitrarily deep 404 path. */
  @font-face {
    font-family: 'Inter';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/assets/fonts/inter.woff2') format('woff2');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #070c18;
    --text: #eef2fb;
    --text-dim: #b9c4dc;
    --text-muted: #8391ad;
    --border: #2c3c5e;
    --brand: #4d9dff;
    --brand-ink: #06131f;
    --brand-soft: rgba(77, 157, 255, 0.12);
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, rgba(77, 157, 255, 0.12), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(34, 211, 238, 0.07), transparent 40%);
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 560px;
  }

  .code {
    font-size: clamp(96px, 18vw, 180px);
    font-weight: 900;
    letter-spacing: -0.05em;
    line-height: 1;
    background: linear-gradient(135deg, #4d9dff 0%, #22d3ee 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }

  h1 {
    font-size: clamp(24px, 4vw, 36px);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }

  p {
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 26px;
    background: var(--brand);
    color: var(--brand-ink);
    border-radius: 100px;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.25s ease;
  }

  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(77, 157, 255, 0.3);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: var(--brand-soft);
    border: 1px solid rgba(77, 157, 255, 0.24);
    border-radius: 100px;
    font-size: 12px;
    color: var(--brand);
    font-weight: 500;
    margin-bottom: 28px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .dot {
    width: 6px;
    height: 6px;
    background: var(--brand);
    border-radius: 50%;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge"><span class="dot"></span> Error</div>
    <div class="code">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back to the homepage.</p>
    <a href="/" class="btn">
      Back to Home
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div>
</body>
</html>
